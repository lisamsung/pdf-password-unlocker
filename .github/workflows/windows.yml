name: Windows tests and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regression tests
        run: python -m unittest -v test_unlocker
      - name: Build standalone application with Windows PowerShell
        shell: powershell
        run: .\build.ps1
